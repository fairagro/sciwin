[workspace]
members = [
    #"packages/cli",
    "packages/core",
    "packages/reana",
    "packages/repository",
    "packages/util",
    "packages/test_utils",
    "packages/remote_execution",
    #"packages/gui", 
    "crates/sciwin",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
repository = "https://github.com/fairagro/sciwin"
license = "MIT OR Apache-2.0"
authors = [
    "Jens Krumsieck",
    "Antonia Leidel",
    "Harald von Waldow",
    "Patrick König",
    "Xaver Stiensmeier",
]

[workspace.dependencies]
# core packages
reana = { version = "0.4.0" }
commonwl = { version = "0.10.0", features = ["engine"] }
git2 = { version = "0.21.0", features = ["vendored-openssl"] }
rocrate = "0.1.0"

# serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.29"
serde_yaml = "0.9.34-deprecated"
toml = "1.1.3"
toml_edit = { version = "0.25.13", features = ["serde"] }
configparser = "3.1.0"

# I/O
dircpy = "0.3.19"
dunce = "1.0.5"
pathdiff = "0.2.3"
tempfile = "3.26.0"
walkdir = "2.5.0"
slugify = "0.1.0"
ignore = "0.4.23"
similar = "3.1.1"

# Networking
url = "2.5.8"
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = [
    "json",
    "blocking",
    "cookies",
    "http2",
], default-features = false }

# async runtime
async-trait = "0.1.91"
tokio = { version = "1.51.1", features = ["macros", "rt"] }
tokio-util = "0.7.19"
futures = "0.3.33"
async-stream = "0.3.6"

# CLI
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
clap_complete = "4.5.61"

# terminal utils
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
colored = "3.1.1"
prettytable-rs = "0.10.0"

# error handling
anyhow = "1.0.104"
thiserror = "2.0.19"
miette = "7.6.0"

# util
semver = { version = "1.0.26", features = ["serde"] }
smart-default = "0.7.1"
bon = "3.9.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
fancy-regex = "0.18.0"
keyring = { version = "3.6.3", features = [
    "apple-native",
    "linux-native",
    "windows-native",
] }
shlex = "2.0.1"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4"] }
syntect = { version = "5.2.0", default-features = false, features = [
    "regex-fancy",
    "parsing",
    "default-themes",
    "default-syntaxes",
] }


# dev dependencies
test_utils = { path = "packages/test_utils" }
rstest = "0.26.1"
fstest = "0.4.0"
serial_test = "3.4.0"

[workspace.lints.clippy]
case_sensitive_file_extension_comparisons = "warn"
borrow_as_ptr = "warn"
format_collect = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
manual_assert = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
wildcard_imports = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
str_split_at_newline = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"

# Dist Settings
[profile.dist]
inherits = "release"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[patch.crates-io]
reana = { path = "../reana-client-rs/crates/reana" }
commonwl = { path = "../commonwl/crates/commonwl" }
rocrate = { path = "../rocrate" }
