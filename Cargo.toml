[workspace]
members = ["crates/sciwin", "crates/cli"]
resolver = "3"

[workspace.package]
version = "2.0.0-beta.2"
edition = "2024"
repository = "https://github.com/fairagro/sciwin"
license = "MIT OR Apache-2.0"
authors = [
    "Jens Krumsieck",
    "Antonia Leidel",
    "Harald von Waldow",
    "Patrick König",
    "Xaver Stiensmeier",
]

[workspace.dependencies]
# core packages
sciwin = { path = "crates/sciwin" }
reana = { version = "0.6" }
commonwl = { version = "0.14", features = ["engine", "tes"] }
rocrate = "0.2"
crankshaft = "0.11.0"
git2 = { version = "0.21.0", features = ["vendored-openssl"] }

# serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "1.1.0"
toml = "1.1.4"
toml_edit = { version = "0.25.13", features = ["serde"] }
configparser = "3.1.0"

# I/O
dircpy = "0.3.19"
dunce = "1.0.5"
pathdiff = "0.2.3"
tempfile = "3.26.0"
walkdir = "2.5.0"
slugify = "0.1.0"
ignore = "0.4.23"
similar = "3.1.1"
file_type = { version = "0.9.0", features = ["httpd"] }

# Networking
url = "2.5.8"
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = [
    "json",
    "cookies",
    "http2",
], default-features = false }

# async runtime
async-trait = "0.1.91"
tokio = { version = "1.51.1", features = ["macros", "rt"] }
tokio-util = "0.7.19"
futures = "0.3.34"
async-stream = "0.3.6"

# CLI
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
clap_complete = "4.5.61"

# requirements parser
uv-requirements-txt = "0.0.72"
uv-pypi-types = "0.0.72"
r-description = "0.4.1"

# terminal utils
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
colored = "3.1.1"
prettytable-rs = "0.10.0"

# error handling
anyhow = "1.0.104"
thiserror = "2.0.20"
miette = "7.6.0"

# util
semver = { version = "1.0.28", features = ["serde"] }
versions = { version = "7.0.0", features = ["serde"] }
smart-default = "0.7.1"
bon = "3.9.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
shlex = "2.0.1"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4"] }
syntect = { version = "5.2.0", default-features = false, features = [
    "regex-fancy",
    "parsing",
    "default-themes",
    "default-syntaxes",
] }


# dev dependencies
rstest = "0.26.1"
fstest = "0.4.0"
serial_test = "4.0.1"

[workspace.lints.clippy]
case_sensitive_file_extension_comparisons = "warn"
borrow_as_ptr = "warn"
format_collect = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
manual_assert = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
wildcard_imports = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
str_split_at_newline = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"

# Dist Settings
[profile.dist]
inherits = "release"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
