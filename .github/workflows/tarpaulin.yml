name: 🦺 Coverage
on:
  workflow_call:

jobs:
  coverage:
    name: ☔ Tarpaulin
    permissions:
      contents: read
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          git config --global user.name "$(git --no-pager log --format=format:'%an' -n 1)"
          git config --global user.email "$(git --no-pager log --format=format:'%ae' -n 1)"
      - name: Disable man-db to make package install and removal faster
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db
      - name: Free Disk Space (Ubuntu) # Attempting to get around 16gb space limitations when using tarpaulin
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install Tarpaulin 📈
        run: cargo install cargo-tarpaulin --force
      - name: Run coverage
        run: |
          cargo tarpaulin \
            --engine llvm \
            -p sciwin -p s4n \
            --out Xml \
            --exclude-files tests/* tests/**/* crates/**/tests/**/* crates/**/tests/*
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "cobertura.xml"
          badge: true
          hide_branch_rate: false
          hide_complexity: true # as it is not supported by tarpaulin
          format: "markdown"
          output: "both"

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
